plugins {
    id 'com.android.application'
}

android {
    namespace 'com.marvice.officetv'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('in.marvice.officetv')
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '3.2'
    }

    // Release key lives OUTSIDE the repo. OFFICETV_SIGNING points at a properties file with
    // storeFile, storePassword, keyAlias, keyPassword (default ~/keystores/officetv-signing.properties).
    // No file, no release build: this app holds company logins, so it is never debug-signed.
    def signingFile = file(System.getenv('OFFICETV_SIGNING') ?: "${System.getProperty('user.home')}/keystores/officetv-signing.properties")
    signingConfigs {
        release {
            if (signingFile.exists()) {
                def p = new Properties()
                signingFile.withInputStream { p.load(it) }
                storeFile file(p.getProperty('storeFile'))
                storePassword p.getProperty('storePassword')
                keyAlias p.getProperty('keyAlias')
                keyPassword p.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            signingConfig signingConfigs.release
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
